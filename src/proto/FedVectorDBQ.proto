syntax = "proto3";
import "google/protobuf/empty.proto";

package FedVectorDBQ;

service FedSqlService {
    rpc ExecuteKnnQuery(KnnSql) returns (google.protobuf.Empty) {}

    rpc ExecuteKnnJoin(KnnJoinSql) returns (google.protobuf.Empty) {}

    rpc GetKnnCandidate(KnnCandReq) returns (KnnCand) {}

    rpc GetKnnJoinCandidate(KnnJoinCandReq) returns (KnnJoinCand) {}

    rpc ClearKnnCandidate(google.protobuf.Empty) returns (google.protobuf.Empty) {}
    
    rpc ClearKnnJoinCandidate(google.protobuf.Empty) returns (google.protobuf.Empty) {}

    rpc SetSearchParameter(SearchParam) returns (google.protobuf.Empty) {}
}

message SearchParam {
    string search_param_name = 1;
    int32 search_param_value = 2;
}

message KnnSql {
    int32 vid = 1;
    int32 k = 2;
    repeated float data = 3;
}

message KnnCandReq {
    int32 k = 1;
}

message VectorData {
    int32 vid = 1;
    repeated float data = 2;
}

message KnnJoinCandReq {
    repeated int32 qid = 1;
    repeated int32 k = 2;
}

message KnnCand {
    int32 qid = 1;
    repeated VectorData knn = 2;
    repeated float dist = 3;
}

message KnnJoinCand {
    repeated KnnCand result = 1;
}

message KnnJoinSql {
    repeated int32 k = 1;
    repeated VectorData queries = 2;
}